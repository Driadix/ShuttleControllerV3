; PlatformIO configuration for the V3 firmware platform (issue #58 execution
; map, design docs/execution-foundation-design-v3.md section 5.1).
; Frozen toolchain per docs/engineering-and-release-baseline-v3.md section 3
; (issue #51). Single production kernel (v3::, cooperative) - the slice kernel
; variants (coop/hybrid/rtos, proving/) were removed at the #70 cutover.
; Repo layout (issue #51 section 5): sources at repo root in domain/ adapters/
; platform/ (no src/ dir).

[platformio]
default_envs = native
test_dir = tests
src_dir = .

; ---------------------------------------------------------------------------
; Shared target settings (frozen toolchain, board baseline - issue #51 sections 3-4)
; ---------------------------------------------------------------------------
[common_firmware]
platform = ststm32@17.4.0
framework = arduino
platform_packages =
  toolchain-gccarmnoneeabi@1.120301.0
  framework-arduinoststm32@4.20701.0
  framework-cmsis@2.50900.0
  tool-scons@4.40801.0
  tool-openocd@3.1200.0
  tool-dfuutil@1.11.0
  tool-stm32duino@1.0.2
board = genericSTM32F405RG
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<domain/*> +<adapters/*> +<platform/*>

; Frozen V1 build flags (hardware contract of the PCB) + language flags mirrored
; from STM32duino core 2.7.1 platform.txt (issue #51 section 4).
; Build evidence: link map + per-function stack usage (obligation #10, issue #43).
build_flags =
  -D NO_HW_SERIAL
  -D HAL_UART_MODULE_DISABLED
  -D ARDUINO_GENERIC_F405RGT
  -D HAL_CAN_MODULE_ENABLED
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wl,-Map=firmware.map
  -fstack-usage

; ---------------------------------------------------------------------------
; Target firmware (single production env, issue #58 execution map).
; ---------------------------------------------------------------------------

[env:firmware]
extends = common_firmware

; ---------------------------------------------------------------------------
; Host test env (issue #51 section 8, design section 7): domain core + kernel
; policy, no Arduino. Adapters are target-only (Arduino Core), excluded.
; GoogleTest package pin is fixed at native env stand-up (issue #51 section 14).
; ---------------------------------------------------------------------------
[common_native]
platform = native
test_framework = googletest
test_build_src = true
lib_deps =
  google/googletest@1.17.0
build_flags =
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wconversion
  -I$PROJECT_DIR
build_src_filter = +<domain/*> +<platform/*> -<platform/main.cpp>

[env:native]
extends = common_native
