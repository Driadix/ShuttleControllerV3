; PlatformIO configuration for the V3 architecture proving slice (issue #54).
; Frozen toolchain per docs/engineering-and-release-baseline-v3.md section 3 (issue #51).
; Kernel variant is selected per-env via V3_KERNEL_COOP/_HYBRID/_RTOS macros; the source tree is shared.

[platformio]
default_envs = native-coop
test_dir = tests
; Repo layout (issue #51 section 5): sources at repo root in domain/ adapters/
; platform/ proving/ (no src/ dir).
src_dir = .

; ---------------------------------------------------------------------------
; Shared target settings (frozen toolchain, board baseline - issue #51 sections 3-4)
; ---------------------------------------------------------------------------
[common_firmware]
platform = ststm32@17.4.0
framework = arduino
platform_packages =
  toolchain-gccarmnoneeabi@1.120301.0
  framework-arduinoststm32@4.20701.0
  framework-cmsis@2.50900.0
  tool-scons@4.40801.0
  tool-openocd@3.1200.0
  tool-dfuutil@1.11.0
  tool-stm32duino@1.0.2
board = genericSTM32F405RG
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<domain/*> +<adapters/*> +<platform/*> +<proving/*>

; Frozen V1 build flags (hardware contract of the PCB) + language flags mirrored
; from STM32duino core 2.7.1 platform.txt (issue #51 section 4).
; Build evidence: link map + per-function stack usage (obligation #10, issue #43).
build_flags =
  -D NO_HW_SERIAL
  -D HAL_UART_MODULE_DISABLED
  -D ARDUINO_GENERIC_F405RGT
  -D HAL_CAN_MODULE_ENABLED
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wl,-Map=firmware.map
  -fstack-usage

; ---------------------------------------------------------------------------
; Kernel variants (issue #51 section 12): separate envs, one source tree.
; ---------------------------------------------------------------------------

[env:firmware-coop]
extends = common_firmware
build_flags = ${common_firmware.build_flags} -DV3_KERNEL_COOP

[env:firmware-hybrid]
extends = common_firmware
build_flags = ${common_firmware.build_flags} -DV3_KERNEL_HYBRID

; RTOS variant: package pin pending research (RTOS kernel candidate, issue #54).
; TODO(slice): add lib_deps pin + FreeRTOSConfig when RtosVariant research lands.
[env:firmware-rtos]
extends = common_firmware
build_flags = ${common_firmware.build_flags} -DV3_KERNEL_RTOS

; ---------------------------------------------------------------------------
; Host test envs (issue #51 section 8): domain core + kernel logic, no Arduino.
; One env per kernel variant (issue #51 section 12: host leg for all three
; variants of the comparison report; CI production host leg = native-coop).
; GoogleTest package pin is fixed at native env stand-up (issue #51 section 14).
; build_src_filter keeps only host-buildable sources (domain/, platform/ kernel
; logic, proving/ harness); target-only sources (main.cpp, adapters/) excluded.
; ---------------------------------------------------------------------------
[common_native]
platform = native
test_framework = googletest
test_build_src = true
; googletest exact pin (issue #51 section 14 Unknown fixed at native env
; stand-up; registry carries 1.12.1 / 1.15.2 / 1.17.0 - research 2026-08-12).
lib_deps =
  google/googletest@1.17.0
build_flags =
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wconversion
  -I$PROJECT_DIR
build_src_filter = +<domain/*> +<platform/*> +<proving/*> -<platform/main.cpp>

[env:native-coop]
extends = common_native
build_flags = ${common_native.build_flags} -DV3_KERNEL_COOP

[env:native-hybrid]
extends = common_native
build_flags = ${common_native.build_flags} -DV3_KERNEL_HYBRID

; RTOS host leg: added when the RTOS package pin lands (issue #54, research).
; [env:native-rtos]
; extends = common_native
; build_flags = ${common_native.build_flags} -DV3_KERNEL_RTOS
