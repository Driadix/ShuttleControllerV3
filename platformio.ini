; PlatformIO configuration for the V3 firmware platform (issue #58 execution
; map, design docs/execution-foundation-design-v3.md section 5.1).
; Frozen toolchain per docs/engineering-and-release-baseline-v3.md section 3
; (issue #51). Single production kernel (v3::, cooperative) - the slice kernel
; variants (coop/hybrid/rtos, proving/) were removed at the #70 cutover.
; Repo layout (issue #51 section 5): sources at repo root in domain/ adapters/
; platform/ (no src/ dir).

[platformio]
default_envs = native
test_dir = tests
src_dir = .

; ---------------------------------------------------------------------------
; Shared target settings (frozen toolchain, board baseline - issue #51 sections 3-4)
; ---------------------------------------------------------------------------
[common_firmware]
platform = ststm32@17.4.0
framework = arduino
platform_packages =
  toolchain-gccarmnoneeabi@1.120301.0
  framework-arduinoststm32@4.20701.0
  framework-cmsis@2.50900.0
  tool-scons@4.40801.0
  tool-openocd@3.1200.0
  tool-dfuutil@1.11.0
  tool-stm32duino@1.0.2
board = genericSTM32F405RG
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<domain/*> +<adapters/*> +<platform/*>

; Frozen V1 build flags (hardware contract of the PCB) + language flags mirrored
; from STM32duino core 2.7.1 platform.txt (issue #51 section 4).
; Build evidence: link map + per-function stack usage (obligation #10, issue #43).
build_flags =
  -D NO_HW_SERIAL
  -D HAL_UART_MODULE_DISABLED
  -D ARDUINO_GENERIC_F405RGT
  -D HAL_CAN_MODULE_ENABLED
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wl,-Map=firmware.map
  -fstack-usage

; ---------------------------------------------------------------------------
; Target firmware (single production env, issue #58 execution map).
; ---------------------------------------------------------------------------

[env:firmware]
extends = common_firmware
; L1 readback observability (sensing slice #63, HITL §0.3): the Sensing
; Service mirror lives in the pinned .bram_sensing section at 0x20011000
; (platform/sensing_schedule.cpp), stripped from the flash image by the
; runner (tools/flash.py strips it like bench/bringup/flash_diag.py) - it
; is runtime RAM, never flashed.
; L1 readback observability (safety slice #71, design §2.5): the Safety
; Authority mirror lives in the pinned .bram_safety section at 0x20012000
; (platform/safety_glue.cpp), stripped from the flash image by the runner.
build_flags =
  ${common_firmware.build_flags}
  -Wl,--section-start=.bram_sensing=0x20011000
  -Wl,--section-start=.bram_safety=0x20012000

; Safety slice L4 loopback leg (design §8 L2): same production firmware, CAN in
; internal LoopBack mode (bxCAN, RM0090) - frames are looped back and ACK'd, so
; the peerless-error path is absent and frame records (id/content/timestamps)
; are verifiable without CAN hardware (#62 absent). .bram_* stripped by the
; runner (tools/flash.py) like env:firmware.
[env:firmware-loopback]
extends = common_firmware
build_flags =
  ${common_firmware.build_flags}
  -Wl,--section-start=.bram_sensing=0x20011000
  -Wl,--section-start=.bram_safety=0x20012000
  -D CAN_LOOPBACK

; ---------------------------------------------------------------------------
; Bring-up diagnostic envs (ticket #61, design docs/bringup-design-v3.md):
; throwaway probes for the Phase-0 -> 1 transition criteria. NOT production
; code - the production CAN HAL is Phase 1. UART is disabled in both (frozen
; baseline), diagnostics go through RAM/registers read back over OpenOCD.
; ---------------------------------------------------------------------------

; CAN1 internal LoopBack probe (D1a): result struct pinned at 0x20010000
; (--section-start .bram_diag), read back by bench/bringup/can_loopback_check.py.
; The marker section is stripped from the flash image by flash_diag.py
; (objcopy --remove-section) - it is runtime RAM, not flash payload.
[env:bringup-can]
extends = common_firmware
build_src_filter = +<bringup/can_loopback.cpp>
build_flags =
  ${common_firmware.build_flags}
  -Wl,--section-start=.bram_diag=0x20010000

; IWDG fire experiment (D2b): arms IWDG with a 2 s window, no reload; the
; board resets itself. RAM phase marker pinned at 0x2000F000 (--section-start
; .bram_wdg, stripped from the flash image by flash_diag.py);
; RCC_CSR.IWDGRSTF + the PASSED marker are read by
; bench/bringup/watchdog_fire_check.py.
[env:bringup-watchdog]
extends = common_firmware
build_src_filter = +<bringup/watchdog_fire.cpp>
build_flags =
  ${common_firmware.build_flags}
  -Wl,--section-start=.bram_wdg=0x2000F000

; ---------------------------------------------------------------------------
; Sensing acquisition prototype (ticket #63, bench/sensing-proto/): THROWAWAY
; diagnostic - answers the sensing-slice design questions (actual ToF/AS5600
; read contract, acquisition cadence, one-read duration, RAM observability
; over OpenOCD). NOT production code: the production I2C adapter and Sensing
; Service are the #63 vertical PR. The diagnostic struct is pinned at
; 0x20011000 (--section-start .bram_sensing), stripped from the flash image
; by bench/sensing-proto/flash_sensing.py, read back by
; bench/sensing-proto/check_sensing.py.
[env:sensing-proto]
extends = common_firmware
build_src_filter = +<bench/sensing-proto/firmware/sensing_proto.cpp>
build_flags =
  ${common_firmware.build_flags}
  -Wl,--section-start=.bram_sensing=0x20011000

; ---------------------------------------------------------------------------
; Host test env (issue #51 section 8, design section 7): domain core + kernel
; policy, no Arduino. Adapters are target-only (Arduino Core), excluded.
; GoogleTest package pin is fixed at native env stand-up (issue #51 section 14).
; ---------------------------------------------------------------------------
[common_native]
platform = native
test_framework = googletest
test_build_src = true
lib_deps =
  google/googletest@1.17.0
build_flags =
  -std=gnu++17
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -ffunction-sections
  -fdata-sections
  -Wconversion
  -I$PROJECT_DIR
build_src_filter = +<domain/*> +<platform/*> -<platform/main.cpp>

[env:native]
extends = common_native
