; Test relay firmware for the L4 sensor bench (ticket #73).
; Runs on LilyGo T-Display S3 (ESP32-S3): receives the controller's
; network_bridge UART (230400 8E1, V1 display profile) on Serial1
; (RX=21, TX=16, pins from the reference ShuttleDisplay firmware) and
; relays the raw byte stream to USB CDC (COM9), rendering a log tail
; on the ST7789 170x320 panel.
;
; Bench tooling only, not production firmware. Owned by the bench
; record docs/l4-sensor-bench-v3.md. Platform/board/flags mirror the
; reference project C:\Projects\Shuttle\ShuttleDisplay (platformio.ini,
; Display_3/tft_setup.h) so wiring matches a proven build.

[platformio]
default_envs = relay

[env:relay]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

build_flags =
    -D SERIAL_RX_BUFFER_SIZE=1024
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -include tft_setup.h

monitor_speed = 230400
